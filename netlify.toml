# La app es 100 % local-first: funciona sin backend.
# Este archivo publica la carpeta public/ tal cual en Netlify.
[build]
  publish = "public"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"
